<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>智慧水务系统@南哪战队</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      /* 背景图片 + 半透明白色叠加 */
      background:
        linear-gradient(rgba(255,255,255,0.8), rgba(255,255,255,0.75)),
        url('background.png') no-repeat center center fixed;
      background-size: cover;
    }
    /* 左侧导航栏 */
    .w-64.bg-blue-800 {
      background-color: rgba(30, 64, 175, 0.75); /* 深蓝色，略透明，文字清晰 */
      backdrop-filter: blur(5px); /* 玻璃效果，可选 */
    }


    /* Spinner 动画 */
    .spinner {
      border: 4px solid #e5e7eb;
      border-top: 4px solid #3b82f6;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    /* 渐变按钮 */
    .btn-gradient {
      background: linear-gradient(to right, #3b82f6, #06b6d4);
      color: white;
      font-weight: 600;
      transition: all 0.3s ease;
    }
    .btn-gradient:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }

    /* 左侧导航 hover & active */
    .nav-btn:hover { background-color: #2563eb; transform: scale(1.02); }
    .nav-btn:active { background-color: #1e40af; }

    /* 表格样式 */
    table th, table td { padding: 0.75rem; border-bottom: 1px solid #e5e7eb; vertical-align: middle; }
    table th { background: #f0f9ff; color: #1e3a8a; text-align: left; }
    table tr:hover { background-color: #f1f5f9; }

    /*!* 标签样式 *!*/
    /*.tag {*/
    /*  padding: 0.25rem 0.5rem;*/
    /*  border-radius: 0.5rem;*/
    /*  font-weight: 500;*/
    /*  font-size: 0.875rem;*/
    /*  color: white;*/
    /*}*/

    /*!* 风险等级样式 *!*/
    /*.tag-high { background-color: #dc2626; }    !* 高风险：红色 *!*/
    /*.tag-medium { background-color: #f59e0b; }  !* 中风险：橙色 *!*/
    /*.tag-low { background-color: #3b82f6; }     !* 低风险：蓝色 *!*/
    /*.tag-none { background-color: #10b981; }    !* 无风险：绿色 *!*/
    /* 标签样式 */
    .tag {
      padding: 0.25rem 0.5rem;
      border-radius: 0.5rem;
      font-weight: 500;
      font-size: 0.875rem;
      color: white;
    }
    .tag-normal { background-color: #10b981; }  /* 绿色 */
    .tag-warning { background-color: #f59e0b; } /* 黄色 */
    .tag-error { background-color: #ef4444; }   /* 红色 */



    /* 页面容器 */
    .page { transition: opacity 0.3s ease; }
  </style>
</head>
<body class="bg-gray-100 min-h-screen flex">

  <!-- 左侧导航栏 -->
  <div class="w-64 bg-blue-800 text-white flex flex-col shadow-lg">
    <div class="p-6 text-2xl font-bold border-b border-blue-700">💧智慧水务系统</div>
    <nav class="flex-1 p-4 space-y-3">
      <button class="w-full text-left px-4 py-2 rounded nav-btn" onclick="showPage('recognition')">水务识别</button>
      <button class="w-full text-left px-4 py-2 rounded nav-btn" onclick="showPage('records')">识别记录</button>
      <button class="w-full text-left px-4 py-2 rounded nav-btn" onclick="showPage('profile')">用户个人信息</button>
    </nav>
  </div>

  <!-- 主体内容 -->
  <div class="flex-1 p-10 overflow-auto">

    <!-- 水务识别页面 -->
    <div id="page-recognition" class="page">
       <!-- 新增欢迎信息 -->
      <h2 class="text-3xl font-semibold mb-6 text-blue-800">水务识别</h2>
      <div class="mb-4 p-4 bg-blue-100 text-blue-800 rounded-xl shadow-inner text-center text-lg font-medium">
          欢迎使用智慧水务系统！请选择音频进行识别。
      </div>
      <div class="bg-white shadow-xl rounded-2xl p-8 space-y-4">
        <input id="audioFile" type="file" accept="audio/*" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-400" />
        <audio id="audioPlayer" controls class="hidden w-full rounded-lg mt-2"></audio>
        <button id="uploadBtn" class="btn-gradient w-full py-3 rounded-xl text-lg">上传并识别</button>

        <div id="loading" class="hidden mt-6 text-center">
          <div class="spinner"></div>
          <p class="mt-2 text-blue-600 font-semibold">识别中，请稍候...</p>
        </div>

        <div id="resultBox" class="hidden mt-6 bg-gray-50 p-6 rounded-xl border border-gray-200 shadow-md">
          <h3 class="font-semibold mb-4 text-gray-800 text-xl">识别结果：</h3>
          <p class="text-gray-700"><strong>文件名：</strong><span id="resFilename">--</span></p>
          <p class="text-gray-700 mt-2"><strong>分类结果：</strong><span id="resLabel" class="tag tag-normal">--</span></p>
          <p class="text-gray-700 mt-2"><strong>识别置信度：</strong><span id="resConf">--</span></p>
        </div>
      </div>
    </div>

    <!-- 识别记录页面 -->
    <div id="page-records" class="page hidden">
      <h2 class="text-3xl font-semibold mb-6 text-blue-800">识别记录</h2>

      <!-- 分页控制 -->
      <div class="flex justify-between items-center mb-4">
        <div>
          <label class="text-gray-700 mr-2">每页显示:</label>
          <select id="pageSizeSelect" class="border rounded px-2 py-1">
            <option value="5">5 条</option>
            <option value="10" selected>10 条</option>
          </select>
        </div>
        <div class="text-gray-600 text-sm" id="totalInfo"></div>
      </div>

      <div class="bg-white shadow-xl rounded-2xl p-6 overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr>
              <th>文件名</th>
              <th>识别结果</th>
              <th>识别置信度</th>
              <th>识别日期</th>
              <th>音频文件</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="recordsTable"></tbody>
        </table>
      </div>

      <!-- 分页按钮 -->
      <div class="flex justify-center mt-4 space-x-2" id="paginationControls"></div>
    </div>

    <!-- 用户个人信息页面 -->
    <div id="page-profile" class="page hidden">
      <h2 class="text-3xl font-semibold mb-6 text-blue-800">用户个人信息</h2>
      <div class="bg-white shadow-xl rounded-2xl p-6 space-y-3">
        <p class="text-gray-800"><strong>用户名：</strong><span id="username">加载中...</span></p>
        <p class="text-gray-800"><strong>邮箱：</strong><span id="useremail">加载中...</span></p>
        <p class="text-gray-800"><strong>注册时间：</strong><span id="regdate">加载中...</span></p>
      </div>
    </div>

  </div>

<script>
function showPage(page) {
  document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
  document.getElementById(`page-${page}`).classList.remove('hidden');
  if(page === "records") loadRecords();
  if(page === "profile") loadProfile();
}

const uploadBtn = document.getElementById('uploadBtn');
const audioInput = document.getElementById('audioFile');
const audioPlayer = document.getElementById('audioPlayer');
const loading = document.getElementById('loading');
const resultBox = document.getElementById('resultBox');
const resFilename = document.getElementById('resFilename');
const resLabel = document.getElementById('resLabel');
const resConf = document.getElementById('resConf');

uploadBtn.addEventListener('click', async () => {
  const file = audioInput.files[0];
  if (!file) { alert("请先选择音频文件！"); return; }

  audioPlayer.src = URL.createObjectURL(file);
  audioPlayer.classList.remove('hidden');

  const formData = new FormData();
  formData.append("file", file);

  loading.classList.remove('hidden');
  resultBox.classList.add('hidden');

  try {
    const response = await fetch("http://127.0.0.1:8000/api/recognize", { method:"POST", body: formData });
    if(!response.ok) throw new Error("识别失败");
    const data = await response.json();

    resFilename.textContent = data.filename || "未知";
    resLabel.textContent = data.result || "未识别到内容";
    resConf.textContent = data.confidence ? data.confidence.toFixed(4) : "--";

    resLabel.className = "tag " + getTagClass(data.result);

    resultBox.classList.remove('hidden');

    await fetch("http://127.0.0.1:8000/api/save_record", {
      method:"POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({
        filename: data.filename,
        result: data.result,
        confidence: data.confidence,
        date: new Date().toLocaleString(),
        filepath: data.filepath
      })
    });

  } catch(err){
    alert("识别失败，请检查后端服务或网络连接。");
    console.error(err);
  } finally {
    loading.classList.add('hidden');
  }
});

// 标签颜色
// function getTagClass(result) {
//   if (!result) return "tag-none";
//   const r = result.toLowerCase();
//
//   if (r.includes("高风险") || r.includes("high")) return "tag-high";
//   if (r.includes("中风险") || r.includes("medium")) return "tag-medium";
//   if (r.includes("低风险") || r.includes("low")) return "tag-low";
//   if (r.includes("无风险") || r.includes("none") || r.includes("normal")) return "tag-none";
//   return "tag-none";
// }
function getTagClass(result) {
  if(!result) return "tag-normal";
  const r = result.toLowerCase();
  if(r.includes("无风险") || r.includes("normal")) return "tag-normal";
  if(r.includes("低风险") || r.includes("warning")) return "tag-warning";
  if(r.includes("高风险") || r.includes("error") || r.includes("leak")) return "tag-error";
  return "tag-normal";
}



// ---------- 分页功能 ----------
let records = [];
let currentPage = 1;
let pageSize = parseInt(document.getElementById("pageSizeSelect").value);

async function loadRecords() {
  const res = await fetch("http://127.0.0.1:8000/api/records");
  records = await res.json();
  currentPage = 1;
  renderTable();
}

function renderTable() {
  const table = document.getElementById("recordsTable");
  table.innerHTML = "";

  const totalPages = Math.ceil(records.length / pageSize);
  const start = (currentPage - 1) * pageSize;
  const end = start + pageSize;
  const pageData = records.slice(start, end);

  pageData.forEach(r => {
    const tagClass = getTagClass(r.result);
    const row = `<tr>
      <td>${r.filename}</td>
      <td><span class="tag ${tagClass}">${r.result}</span></td>
      <td>${r.confidence ?? ""}</td>
      <td>${r.date}</td>
      <td><audio controls src="http://127.0.0.1:8000${r.filepath}" class="rounded-lg"></audio></td>
      <td>
        <button class="bg-red-500 text-white px-3 py-1 rounded hover:bg-red-600" onclick="deleteRecord('${r.filename}')">删除</button>
      </td>
    </tr>`;
    table.innerHTML += row;
  });

  document.getElementById("totalInfo").textContent = `共 ${records.length} 条记录，当前第 ${currentPage} 页 / 共 ${totalPages} 页`;
  renderPagination(totalPages);
}

function renderPagination(totalPages) {
  const container = document.getElementById("paginationControls");
  container.innerHTML = "";

  const createButton = (text, disabled, onclick) => {
    const btn = document.createElement("button");
    btn.textContent = text;
    btn.className = `px-3 py-1 border rounded ${disabled ? "opacity-50 cursor-not-allowed" : "hover:bg-blue-200"}`;
    if (!disabled) btn.onclick = onclick;
    return btn;
  };

  container.appendChild(createButton("上一页", currentPage === 1, () => { currentPage--; renderTable(); }));

  for (let i = 1; i <= totalPages; i++) {
    const btn = document.createElement("button");
    btn.textContent = i;
    btn.className = `px-3 py-1 border rounded ${i === currentPage ? "bg-blue-500 text-white" : "hover:bg-blue-200"}`;
    btn.onclick = () => { currentPage = i; renderTable(); };
    container.appendChild(btn);
  }

  container.appendChild(createButton("下一页", currentPage === totalPages || totalPages === 0, () => { currentPage++; renderTable(); }));
}

document.getElementById("pageSizeSelect").addEventListener("change", () => {
  pageSize = parseInt(document.getElementById("pageSizeSelect").value);
  currentPage = 1;
  renderTable();
});

// 用户信息
async function loadProfile() {
  const res = await fetch("http://127.0.0.1:8000/api/userinfo");
  const user = await res.json();
  document.getElementById("username").textContent = user.username;
  document.getElementById("useremail").textContent = user.email;
  document.getElementById("regdate").textContent = user.regdate;
}

// 删除记录
async function deleteRecord(filename) {
  if(!confirm(`确定要删除文件 ${filename} 吗？`)) return;
  try {
    const res = await fetch("http://127.0.0.1:8000/api/delete_record", {
      method:"POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ filename })
    });
    const data = await res.json();
    if(data.status==="ok"){ alert("删除成功！"); loadRecords(); }
    else alert("删除失败：" + data.error);
  } catch(err) {
    alert("删除请求失败，请检查后端服务或网络连接。");
    console.error(err);
  }
}
</script>
</body>
</html>
